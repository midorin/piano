<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>ピアノスケール - 指使い表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .key-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 40px;
        }

        .key-button {
            padding: 15px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .key-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .key-button.active {
            background: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .scale-display {
            display: none;
        }

        .scale-display.active {
            display: block;
        }

        .hand-section {
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
        }

        .hand-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hand-icon {
            font-size: 1.2em;
        }

        .scale-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1em;
            color: #333;
            font-weight: bold;
        }

        .notes-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .note-block {
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 10px 15px;
            min-width: 80px;
            text-align: center;
        }

        .note-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .finger-number {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .octave-label {
            font-size: 0.8em;
            color: #999;
            margin-top: 3px;
        }

        .direction-indicator {
            display: inline-block;
            padding: 5px 10px;
            background: #764ba2;
            color: white;
            border-radius: 5px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .ascending {
            background: #4CAF50;
        }

        .descending {
            background: #FF9800;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .key-selector {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

                    ['A♭', 1, 1], ['B♭', 2, 1], ['C', 3, 1], ['D♭', 4, 1], ['E♭', 5, 1],
                    ['F', 1, 2], ['G', 2, 2], ['A♭', 3, 2], ['B♭', 4, 2], ['C', 5, 2],
                    ['D♭', 1, 3], ['E♭', 2, 3], ['F', 3, 3], ['G', 4, 3], ['A♭', 5, 3]
                ],
                rightDescending: [
                    ['A♭', 5, 3], ['G', 4, 3], ['F', 3, 3], ['E♭', 2, 3], ['D♭', 1, 3],
                    ['C', 5, 2], ['B♭', 4, 2], ['A♭', 3, 2], ['G', 2, 2], ['F', 1, 2],
                    ['E♭', 5, 1], ['D♭', 4, 1], ['C', 3, 1], ['B♭', 2, 1], ['A♭', 1, 1]
                ],
                leftAscending: [
                    ['A♭', 5, 1], ['B♭', 4, 1], ['C', 3, 1], ['D♭', 2, 1], ['E♭', 1, 1],
                    ['F', 3, 2], ['G', 2, 2], ['A♭', 1, 2], ['B♭', 4, 2], ['C', 3, 2],
                    ['D♭', 2, 2], ['E♭', 1, 2], ['F', 3, 3], ['G', 2, 3], ['A♭', 1, 3]
                ],
                leftDescending: [
                    ['A♭', 1, 3], ['G', 2, 3], ['F', 3, 3], ['E♭', 1, 2], ['D♭', 2, 2],
                    ['C', 3, 2], ['B♭', 4, 2], ['A♭', 1, 2], ['G', 2, 2], ['F', 3, 2],
                    ['E♭', 1, 1], ['D♭', 2, 1], ['C', 3, 1], ['B♭', 4, 1], ['A♭', 5, 1]
                ]
            }
        };

        // Initialize the app
        function init() {
            populateKeySelector();
            // Default to C major
            displayScale('C');
        }

        // Populate key selector buttons
        function populateKeySelector() {
            const keySelector = document.getElementById('keySelector');
            const keys = Object.keys(scaleFingerings);

            keys.forEach((key, index) => {
                const button = document.createElement('button');
                button.className = 'key-button' + (index === 0 ? ' active' : '');
                button.textContent = key;
                button.onclick = () => {
                    document.querySelectorAll('.key-button').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    displayScale(key);
                };
                keySelector.appendChild(button);
            });
        }

        // Display scale fingerings for a specific key
        function displayScale(key) {
            const scaleData = scaleFingerings[key];
            const displayDiv = document.getElementById('scaleDisplay');

            displayDiv.innerHTML = `
                <div class="scale-info">
                    <div class="info-card">
                        <div class="info-label">調名</div>
                        <div class="info-value">${scaleData.name}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">音階</div>
                        <div class="info-value">2オクターブ</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">タイプ</div>
                        <div class="info-value">メジャースケール</div>
                    </div>
                </div>

                <div class="hand-section">
                    <h2 class="hand-title">
                        <span class="hand-icon">👉</span>
                        右手 (Right Hand)
                        <span class="direction-indicator ascending">上行 ↑</span>
                    </h2>
                    <div class="notes-container">
                        ${generateNoteBlocks(scaleData.rightAscending)}
                    </div>
                </div>

                <div class="hand-section">
                    <h2 class="hand-title">
                        <span class="hand-icon">👉</span>
                        右手 (Right Hand)
                        <span class="direction-indicator descending">下行 ↓</span>
                    </h2>
                    <div class="notes-container">
                        ${generateNoteBlocks(scaleData.rightDescending)}
                    </div>
                </div>

                <div class="hand-section">
                    <h2 class="hand-title">
                        <span class="hand-icon">👈</span>
                        左手 (Left Hand)
                        <span class="direction-indicator ascending">上行 ↑</span>
                    </h2>
                    <div class="notes-container">
                        ${generateNoteBlocks(scaleData.leftAscending)}
                    </div>
                </div>

                <div class="hand-section">
                    <h2 class="hand-title">
                        <span class="hand-icon">👈</span>
                        左手 (Left Hand)
                        <span class="direction-indicator descending">下行 ↓</span>
                    </h2>
                    <div class="notes-container">
                        ${generateNoteBlocks(scaleData.leftDescending)}
                    </div>
                </div>
            `;
        }

        // Generate note blocks HTML
        function generateNoteBlocks(notes) {
            return notes.map(([note, finger, octave]) => `
                <div class="note-block">
                    <div class="note-name">${note}</div>
                    <div class="finger-number">${finger}</div>
                    <div class="octave-label">第${octave}オクターブ</div>
                </div>
            `).join('');
        }

        // Start the app when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
